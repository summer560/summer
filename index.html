<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<title>Dot Rabbit Runner v2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Press Start 2P', 'Courier New', monospace;
    overflow: hidden;
  }
  #gameWrapper {
    position: relative;
    width: 100%;
    max-width: 800px;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated;
    background: #c8e6f8;
  }
  #startOverlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(200,230,255,0.75);
    cursor: pointer;
    z-index: 10;
  }
  #startOverlay .sub {
    font-size: 12px;
    color: #ffffff;
    font-family: 'Press Start 2P', monospace;
    letter-spacing: 2px;
    text-shadow: -2px 0 #7a9bb5, 2px 0 #7a9bb5, 0 -2px #7a9bb5, 0 2px #7a9bb5;
    margin-bottom: 10px;
  }
  #startOverlay .sub2 {
    font-size: 8px;
    color: #8ab0c8;
    font-family: 'Press Start 2P', monospace;
    letter-spacing: 2px;
  }
  #startOverlay.hidden { display: none; }
</style>
</head>
<body>
<div id="gameWrapper">
  <canvas id="game" width="800" height="350"></canvas>
  <div id="startOverlay">
    <div class="sub">CLICK or TAP to START</div>
    <div class="sub2">JUMP : SPACE / TAP</div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('startOverlay');

  // ── Constants ──
  const W = 800, H = 350;
  const GROUND_Y = 290;
  const GRAVITY = 0.6;
  const JUMP_FORCE = -11;
  const INITIAL_SPEED = 5;
  const MAX_SPEED = 14;
  const ACCEL = 0.005;
  const PIXEL = 4; // dot size for pixel art

  // ── Game State ──
  let state = 'idle'; // idle | running | dead
  let speed = INITIAL_SPEED;
  let score = 0;
  let highScore = parseInt(localStorage.getItem('rabbitHigh') || '0');
  let frameCount = 0;
  let scoreFlash = 0;

  // ── Rabbit (grid-based pixel art) ──
  const P = PIXEL;
  const rabbit = {
    x: 60, y: GROUND_Y, vy: 0, w: 40, h: 48,
    grounded: true, frame: 0, frameTimer: 0
  };

  // Grid sprite: each row is a string, each char maps to a color
  // . = transparent, o = outline, b = body pink, e = ear inner,
  // w = white, p = pupil, n = nose, c = cheek, t = tail, m = mouth
  // Yellow rabbit palette
  const PAL = {
    '.': null,
    'o': '#c8a850',  // golden outline
    'b': '#fff2b0',  // soft yellow body
    'B': '#fff8d0',  // lighter yellow belly
    'e': '#ffe080',  // ear inner
    'w': '#fffbe8',
    'p': '#5a4020',  // dark brown pupil
    'n': '#f0d898',  // nose
    'c': '#ffd88a',  // cheek
    't': '#fffadc',  // tail
    'x': '#5a4020',
    's': '#a0d8ef',
    'm': '#c8a850',
  };

  // Front-facing cute rabbit (10 wide x 12 tall)
  const SPRITES = {
    run1: [
      '..ob.ob...',
      '..oe.oe...',
      '..ob.ob...',
      '.obbbbbo..',
      '.bbpbpbb..',
      '.bcbnbcb..',
      '.obbbbbbo.',
      'tobBBBBbo.',
      '.obBBBBbo.',
      '.obbbbbo..',
      '..ob..ob..',
      '..ob..ob..',
    ],
    run2: [
      '..ob.ob...',
      '..oe.oe...',
      '..ob.ob...',
      '.obbbbbo..',
      '.bbpbpbb..',
      '.bcbnbcb..',
      '.obbbbbbo.',
      'tobBBBBbo.',
      '.obBBBBbo.',
      '.obbbbbo..',
      '...ob.ob..',
      '..ob......',
    ],
    jump: [
      '..ob.ob...',
      '..oe.oe...',
      '..ob.ob...',
      '.obbbbbo..',
      '.bbpbpbb..',
      '.bcbnbcb..',
      '.obbbbbbo.',
      'tobBBBBbo.',
      '.obBBBBbo.',
      '.obbbbbo..',
      '..oooooo..',
      '..........',
    ],
    dead: [
      '..ob.ob...',
      '..oe.oe...',
      '..ob.ob...',
      '.obbbbbo.s',
      '.bbpbpbbs.',
      '.bcbnbcb..',
      '.obbmbbo..',
      'tobBBBBbo.',
      '.obBBBBbo.',
      '.obbbbbo..',
      '..ob..ob..',
      '..ob..ob..',
    ],
  };

  function drawGrid(grid, x, y) {
    for (let r = 0; r < grid.length; r++) {
      const row = grid[r];
      for (let c = 0; c < row.length; c++) {
        const ch = row[c];
        if (ch === '.') continue;
        const color = PAL[ch];
        if (!color) continue;
        ctx.fillStyle = color;
        ctx.fillRect(x + c * P, y + r * P, P, P);
      }
    }
  }

  // ── Obstacles (pixel art carrots) ──
  let obstacles = [];
  const OBSTACLE_TYPES = [
    { w: 20, h: 36, sprite: 'carrot_small' },
    { w: 20, h: 48, sprite: 'carrot_tall' },
    { w: 44, h: 36, sprite: 'carrot_double' },
  ];

  // Carrot grid sprite (5 wide)
  // g = dark green, G = light green, O = dark orange, o = orange, h = highlight, T = tip
  const CARROT_PAL = {
    '.': null,
    'g': '#88cc88',
    'G': '#b0e8a0',
    'O': '#f0a060',
    'o': '#ffb87a',
    'h': '#ffd4a8',
    'L': '#f5a868',
  };

  const CARROT_SMALL = [
    //01234
    '.gGg.',  // leaves
    'g.G.g',
    '..g..',
    '.OOO.',  // top
    '.ooo.',
    '.Lho.',
    '.ooo.',
    '.Lho.',
    '..o..',
    '..O..',  // tip
  ];

  const CARROT_TALL = [
    '.gGg.',
    'g.G.g',
    '..g..',
    '.OOO.',
    '.ooo.',
    '.Lho.',
    '.ooo.',
    '.Lho.',
    '.ooo.',
    '.oho.',
    '.ooo.',
    '..o..',
    '..o..',
    '..O..',
  ];

  function drawCarrotGrid(grid, x, y, scaleY) {
    const rowH = scaleY || P;
    for (let r = 0; r < grid.length; r++) {
      const row = grid[r];
      for (let c = 0; c < row.length; c++) {
        const ch = row[c];
        if (ch === '.') continue;
        const color = CARROT_PAL[ch];
        if (!color) continue;
        ctx.fillStyle = color;
        ctx.fillRect(x + c * P, y + r * rowH, P, rowH);
      }
    }
  }

  function drawCarrot(x, y, w, h, sprite) {
    const grid = sprite === 'carrot_tall' ? CARROT_TALL : CARROT_SMALL;
    const scaleY = h / grid.length;
    drawCarrotGrid(grid, x, y, scaleY);
  }

  function spawnObstacle() {
    const type = OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)];
    const gap = 300 + Math.random() * 200;
    const lastX = obstacles.length > 0 ? obstacles[obstacles.length - 1].x : W;
    obstacles.push({
      x: Math.max(W, lastX + gap),
      y: GROUND_Y - type.h + 4,
      w: type.w,
      h: type.h,
      sprite: type.sprite
    });
  }

  // ── Ground ──
  let groundOffset = 0;
  const groundDots = [];
  for (let i = 0; i < 50; i++) {
    groundDots.push({
      x: Math.random() * W * 2,
      y: GROUND_Y + 8 + Math.random() * 20
    });
  }

  // ── Clouds ──
  let clouds = [];
  for (let i = 0; i < 4; i++) {
    clouds.push({
      x: Math.random() * W,
      y: 30 + Math.random() * 60,
      w: 40 + Math.random() * 30,
      speed: 0.3 + Math.random() * 0.5
    });
  }

  function drawCloud(c) {
    ctx.fillStyle = '#e8f0f8';
    ctx.fillRect(c.x, c.y, c.w, PIXEL*2);
    ctx.fillRect(c.x + PIXEL*2, c.y - PIXEL, c.w - PIXEL*4, PIXEL);
    ctx.fillRect(c.x + PIXEL, c.y + PIXEL*2, c.w - PIXEL*2, PIXEL);
  }

  // ── Collision ──
  function checkCollision(r, o) {
    const pad = 6;
    return (
      r.x + pad < o.x + o.w - pad &&
      r.x + r.w - pad > o.x + pad &&
      r.y + r.h - pad < o.y + o.h &&
      r.y + r.h > o.y + pad
    );
  }

  // ── Input ──
  function jump() {
    if (state === 'idle') {
      state = 'running';
      overlay.classList.add('hidden');
    }
    if (state === 'dead') {
      resetGame();
      state = 'running';
      return;
    }
    if (rabbit.grounded && state === 'running') {
      rabbit.vy = JUMP_FORCE;
      rabbit.grounded = false;
    }
  }

  document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      jump();
    }
  });
  canvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); });
  canvas.addEventListener('mousedown', e => { jump(); });
  overlay.addEventListener('click', () => { jump(); });
  overlay.addEventListener('touchstart', e => { e.preventDefault(); jump(); });

  // ── Reset ──
  function resetGame() {
    rabbit.y = GROUND_Y;
    rabbit.vy = 0;
    rabbit.grounded = true;
    obstacles.length = 0;
    speed = INITIAL_SPEED;
    score = 0;
    frameCount = 0;
    scoreFlash = 0;
    overlay.classList.add('hidden');
  }

  // ── Pixel outline text helper ──
  function drawPixelText(text, x, y, font) {
    ctx.font = font;
    ctx.fillStyle = '#7a9bb5';
    const d = 2;
    ctx.fillText(text, x - d, y);
    ctx.fillText(text, x + d, y);
    ctx.fillText(text, x, y - d);
    ctx.fillText(text, x, y + d);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(text, x, y);
  }

  // ── Score Display ──
  function drawScore() {
    ctx.textAlign = 'right';
    const s = String(Math.floor(score)).padStart(5, '0');
    const showScore = scoreFlash === 0 || Math.floor(scoreFlash / 3) % 2 === 0;
    const font = '12px "Press Start 2P", monospace';
    if (highScore > 0) {
      drawPixelText('HI ' + String(highScore).padStart(5, '0'), W - 160, 25, font);
      if (showScore) {
        drawPixelText(s, W - 20, 25, font);
      }
    } else {
      if (showScore) {
        drawPixelText(s, W - 20, 25, font);
      }
    }
  }

  // ── Game Over ──
  function drawGameOver() {
    ctx.textAlign = 'center';
    drawPixelText('GAME OVER', W/2, H/2 - 30, '20px "Press Start 2P", monospace');
    drawPixelText('TAP / SPACE TO RESTART', W/2, H/2 + 10, '9px "Press Start 2P", monospace');
  }

  // ── Idle bounce ──
  let idleTimer = 0;

  // ── Main Loop ──
  function update() {
    // Animate rabbit legs always
    rabbit.frameTimer++;
    if (rabbit.frameTimer > 6) {
      rabbit.frame = 1 - rabbit.frame;
      rabbit.frameTimer = 0;
    }

    // Idle: auto bounce rabbit
    if (state === 'idle') {
      idleTimer++;
      if (idleTimer % 60 === 0) {
        rabbit.vy = JUMP_FORCE * 0.6;
        rabbit.grounded = false;
      }
      rabbit.vy += GRAVITY;
      rabbit.y += rabbit.vy;
      if (rabbit.y >= GROUND_Y) {
        rabbit.y = GROUND_Y;
        rabbit.vy = 0;
        rabbit.grounded = true;
      }
      return;
    }

    if (state !== 'running') return;

    frameCount++;
    speed = Math.min(MAX_SPEED, INITIAL_SPEED + frameCount * ACCEL);
    score += speed * 0.05;

    // Milestone flash every 100 points
    const prev = Math.floor((score - speed * 0.05));
    const curr = Math.floor(score);
    if (Math.floor(curr / 100) > Math.floor(prev / 100) && curr > 0) {
      scoreFlash = 30;
    }
    if (scoreFlash > 0) scoreFlash--;

    // Rabbit physics
    rabbit.vy += GRAVITY;
    rabbit.y += rabbit.vy;
    if (rabbit.y >= GROUND_Y) {
      rabbit.y = GROUND_Y;
      rabbit.vy = 0;
      rabbit.grounded = true;
    }

    // Ground scroll
    groundOffset = (groundOffset + speed) % W;

    // Clouds
    clouds.forEach(c => {
      c.x -= c.speed;
      if (c.x + c.w < 0) {
        c.x = W + Math.random() * 100;
        c.y = 30 + Math.random() * 60;
      }
    });

    // Obstacles
    if (obstacles.length === 0 || obstacles[obstacles.length - 1].x < W - 200) {
      if (Math.random() < 0.02 || obstacles.length === 0) {
        spawnObstacle();
      }
    }
    obstacles.forEach(o => { o.x -= speed; });
    obstacles = obstacles.filter(o => o.x + o.w > -50);

    // Collision
    const rBox = {
      x: rabbit.x, y: rabbit.y - rabbit.h,
      w: rabbit.w, h: rabbit.h
    };
    for (const o of obstacles) {
      if (checkCollision(rBox, o)) {
        state = 'dead';
        if (Math.floor(score) > highScore) {
          highScore = Math.floor(score);
          localStorage.setItem('rabbitHigh', String(highScore));
        }
        break;
      }
    }
  }

  function draw() {
    // Sky gradient
    ctx.fillStyle = '#c8e6f8';
    ctx.fillRect(0, 0, W, GROUND_Y + 4);
    // Ground area
    ctx.fillStyle = '#e8d8c0';
    ctx.fillRect(0, GROUND_Y + 4, W, H - GROUND_Y - 4);
    // Ground line
    ctx.fillStyle = '#c4a882';
    ctx.fillRect(0, GROUND_Y + 4, W, 2);

    // Clouds
    clouds.forEach(drawCloud);

    // Ground dots
    groundDots.forEach(d => {
      const dx = ((d.x - groundOffset) % (W * 2) + W * 2) % (W * 2) - W * 0.5;
      if (dx > -10 && dx < W + 10) {
        ctx.fillStyle = '#d4c0a0';
        ctx.fillRect(dx, d.y, 2, 1);
      }
    });

    // Obstacles
    obstacles.forEach(o => {
      if (o.sprite === 'carrot_double') {
        drawCarrot(o.x, o.y, 20, o.h, 'carrot_small');
        drawCarrot(o.x + 22, o.y, 20, o.h, 'carrot_small');
      } else {
        drawCarrot(o.x, o.y, o.w, o.h, o.sprite);
      }
    });

    // Rabbit
    const spriteY = rabbit.y - rabbit.h;
    let spriteKey;
    if (state === 'dead') {
      spriteKey = 'dead';
    } else if (!rabbit.grounded) {
      spriteKey = 'jump';
    } else {
      spriteKey = rabbit.frame === 0 ? 'run1' : 'run2';
    }
    drawGrid(SPRITES[spriteKey], rabbit.x, spriteY);

    // Score
    drawScore();

    // Game over overlay
    if (state === 'dead') {
      drawGameOver();
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  loop();
})();
</script>
</body>
</html>
