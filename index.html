<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dot Rabbit Runner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f7f7f7;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  #gameWrapper {
    position: relative;
    width: 100%;
    max-width: 800px;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated;
    background: #f7f7f7;
  }
  #startOverlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(247,247,247,0.85);
    cursor: pointer;
    z-index: 10;
  }
  #startOverlay .title {
    font-size: 28px;
    font-weight: bold;
    color: #535353;
    margin-bottom: 8px;
    letter-spacing: 2px;
  }
  #startOverlay .sub {
    font-size: 14px;
    color: #888;
  }
  #startOverlay.hidden { display: none; }
</style>
</head>
<body>
<div id="gameWrapper">
  <canvas id="game" width="800" height="250"></canvas>
  <div id="startOverlay">
    <div class="title">DOT RABBIT RUNNER</div>
    <div class="sub">Press Space / Tap to Start</div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('startOverlay');

  // ── Constants ──
  const W = 800, H = 250;
  const GROUND_Y = 200;
  const GRAVITY = 0.6;
  const JUMP_FORCE = -11;
  const INITIAL_SPEED = 5;
  const MAX_SPEED = 13;
  const ACCEL = 0.001;
  const PIXEL = 4; // dot size for pixel art

  // ── Game State ──
  let state = 'idle'; // idle | running | dead
  let speed = INITIAL_SPEED;
  let score = 0;
  let highScore = parseInt(localStorage.getItem('rabbitHigh') || '0');
  let frameCount = 0;

  // ── Rabbit ──
  const rabbit = {
    x: 60, y: GROUND_Y, vy: 0, w: 28, h: 32,
    grounded: true, frame: 0, frameTimer: 0
  };

  // Rabbit pixel sprites (run frame 1, run frame 2, jump, dead)
  // Each sprite is an array of [x, y] pixel positions (in 4px grid)
  const RABBIT_SPRITES = {
    run1: [
      // ears
      [2,0],[4,0],
      [2,1],[4,1],
      // head
      [1,2],[2,2],[3,2],[4,2],[5,2],
      [1,3],[2,3],[3,3],[4,3],[5,3],
      // eye
      [4,2],
      // body
      [1,4],[2,4],[3,4],[4,4],[5,4],
      [0,5],[1,5],[2,5],[3,5],[4,5],[5,5],[6,5],
      [1,6],[2,6],[3,6],[4,6],[5,6],
      // tail
      [0,5],
      // legs (run pose 1)
      [1,7],[2,7],[4,7],[5,7],
    ],
    run2: [
      [2,0],[4,0],
      [2,1],[4,1],
      [1,2],[2,2],[3,2],[4,2],[5,2],
      [1,3],[2,3],[3,3],[4,3],[5,3],
      [4,2],
      [1,4],[2,4],[3,4],[4,4],[5,4],
      [0,5],[1,5],[2,5],[3,5],[4,5],[5,5],[6,5],
      [1,6],[2,6],[3,6],[4,6],[5,6],
      [0,5],
      // legs (run pose 2)
      [2,7],[3,7],[5,7],
      [1,8],
    ],
    jump: [
      [2,0],[4,0],
      [2,1],[4,1],
      [1,2],[2,2],[3,2],[4,2],[5,2],
      [1,3],[2,3],[3,3],[4,3],[5,3],
      [4,2],
      [1,4],[2,4],[3,4],[4,4],[5,4],
      [0,5],[1,5],[2,5],[3,5],[4,5],[5,5],[6,5],
      [1,6],[2,6],[3,6],[4,6],[5,6],
      [0,5],
      // legs tucked
      [2,7],[3,7],[4,7],[5,7],
    ],
    dead: [
      [2,0],[4,0],
      [2,1],[4,1],
      [1,2],[2,2],[3,2],[4,2],[5,2],
      [1,3],[2,3],[3,3],[4,3],[5,3],
      // X eyes
      [3,3],[5,3],
      [1,4],[2,4],[3,4],[4,4],[5,4],
      [0,5],[1,5],[2,5],[3,5],[4,5],[5,5],[6,5],
      [1,6],[2,6],[3,6],[4,6],[5,6],
      [0,5],
      [1,7],[2,7],[4,7],[5,7],
    ]
  };

  function drawRabbitSprite(sprite, x, y, color) {
    ctx.fillStyle = color;
    sprite.forEach(([px, py]) => {
      ctx.fillRect(x + px * PIXEL, y + py * PIXEL, PIXEL, PIXEL);
    });
  }

  // Eye detail
  function drawEye(x, y, dead) {
    if (dead) {
      // X eye
      ctx.fillStyle = '#fff';
      ctx.fillRect(x + 3*PIXEL, y + 2*PIXEL, PIXEL, PIXEL);
      ctx.fillRect(x + 5*PIXEL, y + 2*PIXEL, PIXEL, PIXEL);
    } else {
      ctx.fillStyle = '#fff';
      ctx.fillRect(x + 4*PIXEL, y + 2*PIXEL, PIXEL, PIXEL);
      ctx.fillStyle = '#000';
      ctx.fillRect(x + 4*PIXEL + 2, y + 2*PIXEL + 2, 2, 2);
    }
  }

  // ── Obstacles ──
  let obstacles = [];
  const OBSTACLE_TYPES = [
    // small cactus → carrot
    { w: 16, h: 28, sprite: 'carrot_small' },
    // tall cactus → carrot tall
    { w: 16, h: 40, sprite: 'carrot_tall' },
    // double
    { w: 32, h: 28, sprite: 'carrot_double' },
  ];

  function drawCarrot(x, y, w, h) {
    // Orange body
    ctx.fillStyle = '#e87000';
    const bx = x + 2, by = y + 8;
    const bw = w - 4, bh = h - 8;
    for (let row = 0; row < bh; row += PIXEL) {
      const shrink = Math.floor(row / bh * 3) * PIXEL;
      ctx.fillRect(bx + shrink, by + row, bw - shrink * 2, PIXEL);
    }
    // Green top
    ctx.fillStyle = '#2a8c00';
    ctx.fillRect(x + w/2 - PIXEL, y, PIXEL*2, PIXEL*3);
    ctx.fillRect(x + w/2 - PIXEL*2, y, PIXEL, PIXEL*2);
    ctx.fillRect(x + w/2 + PIXEL, y, PIXEL, PIXEL*2);
  }

  function spawnObstacle() {
    const type = OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)];
    const gap = 300 + Math.random() * 200;
    const lastX = obstacles.length > 0 ? obstacles[obstacles.length - 1].x : W;
    obstacles.push({
      x: Math.max(W, lastX + gap),
      y: GROUND_Y - type.h + 4,
      w: type.w,
      h: type.h,
      sprite: type.sprite
    });
  }

  // ── Ground ──
  let groundOffset = 0;
  const groundDots = [];
  for (let i = 0; i < 50; i++) {
    groundDots.push({
      x: Math.random() * W * 2,
      y: GROUND_Y + 8 + Math.random() * 20
    });
  }

  // ── Clouds ──
  let clouds = [];
  for (let i = 0; i < 4; i++) {
    clouds.push({
      x: Math.random() * W,
      y: 30 + Math.random() * 60,
      w: 40 + Math.random() * 30,
      speed: 0.3 + Math.random() * 0.5
    });
  }

  function drawCloud(c) {
    ctx.fillStyle = '#e0e0e0';
    ctx.fillRect(c.x, c.y, c.w, PIXEL*2);
    ctx.fillRect(c.x + PIXEL*2, c.y - PIXEL, c.w - PIXEL*4, PIXEL);
    ctx.fillRect(c.x + PIXEL, c.y + PIXEL*2, c.w - PIXEL*2, PIXEL);
  }

  // ── Collision ──
  function checkCollision(r, o) {
    const pad = 6;
    return (
      r.x + pad < o.x + o.w - pad &&
      r.x + r.w - pad > o.x + pad &&
      r.y + r.h - pad < o.y + o.h &&
      r.y + r.h > o.y + pad
    );
  }

  // ── Input ──
  function jump() {
    if (state === 'idle') {
      state = 'running';
      overlay.classList.add('hidden');
    }
    if (state === 'dead') {
      resetGame();
      state = 'running';
      return;
    }
    if (rabbit.grounded && state === 'running') {
      rabbit.vy = JUMP_FORCE;
      rabbit.grounded = false;
    }
  }

  document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      jump();
    }
  });
  canvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); });
  canvas.addEventListener('mousedown', e => { jump(); });
  overlay.addEventListener('click', () => { jump(); });
  overlay.addEventListener('touchstart', e => { e.preventDefault(); jump(); });

  // ── Reset ──
  function resetGame() {
    rabbit.y = GROUND_Y;
    rabbit.vy = 0;
    rabbit.grounded = true;
    obstacles.length = 0;
    speed = INITIAL_SPEED;
    score = 0;
    frameCount = 0;
    overlay.classList.add('hidden');
  }

  // ── Score Display ──
  function drawScore() {
    ctx.fillStyle = '#535353';
    ctx.font = 'bold 16px "Courier New", monospace';
    ctx.textAlign = 'right';
    const s = String(Math.floor(score)).padStart(5, '0');
    if (highScore > 0) {
      ctx.fillStyle = '#999';
      ctx.fillText('HI ' + String(highScore).padStart(5, '0'), W - 20, 25);
      ctx.fillStyle = '#535353';
      ctx.fillText(s, W - 120, 25);
    } else {
      ctx.fillText(s, W - 20, 25);
    }
  }

  // ── Game Over ──
  function drawGameOver() {
    ctx.fillStyle = '#535353';
    ctx.font = 'bold 20px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W/2, H/2 - 20);
    ctx.font = '14px "Courier New", monospace';
    ctx.fillText('Tap / Press Space to Restart', W/2, H/2 + 10);
  }

  // ── Main Loop ──
  function update() {
    if (state !== 'running') return;

    frameCount++;
    speed = Math.min(MAX_SPEED, INITIAL_SPEED + frameCount * ACCEL);
    score += speed * 0.02;

    // Milestone sound flash
    if (Math.floor(score) % 100 === 0 && Math.floor(score) > 0) {
      // flash effect handled in draw
    }

    // Rabbit physics
    rabbit.vy += GRAVITY;
    rabbit.y += rabbit.vy;
    if (rabbit.y >= GROUND_Y) {
      rabbit.y = GROUND_Y;
      rabbit.vy = 0;
      rabbit.grounded = true;
    }

    // Animation
    rabbit.frameTimer++;
    if (rabbit.frameTimer > 6) {
      rabbit.frame = 1 - rabbit.frame;
      rabbit.frameTimer = 0;
    }

    // Ground scroll
    groundOffset = (groundOffset + speed) % W;

    // Clouds
    clouds.forEach(c => {
      c.x -= c.speed;
      if (c.x + c.w < 0) {
        c.x = W + Math.random() * 100;
        c.y = 30 + Math.random() * 60;
      }
    });

    // Obstacles
    if (obstacles.length === 0 || obstacles[obstacles.length - 1].x < W - 200) {
      if (Math.random() < 0.02 || obstacles.length === 0) {
        spawnObstacle();
      }
    }
    obstacles.forEach(o => { o.x -= speed; });
    obstacles = obstacles.filter(o => o.x + o.w > -50);

    // Collision
    const rBox = {
      x: rabbit.x, y: rabbit.y - rabbit.h,
      w: rabbit.w, h: rabbit.h
    };
    for (const o of obstacles) {
      if (checkCollision(rBox, o)) {
        state = 'dead';
        if (Math.floor(score) > highScore) {
          highScore = Math.floor(score);
          localStorage.setItem('rabbitHigh', String(highScore));
        }
        break;
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Clouds
    clouds.forEach(drawCloud);

    // Ground line
    ctx.fillStyle = '#535353';
    ctx.fillRect(0, GROUND_Y + 4, W, 1);

    // Ground dots
    groundDots.forEach(d => {
      const dx = ((d.x - groundOffset) % (W * 2) + W * 2) % (W * 2) - W * 0.5;
      if (dx > -10 && dx < W + 10) {
        ctx.fillStyle = '#ccc';
        ctx.fillRect(dx, d.y, 2, 1);
      }
    });

    // Obstacles
    obstacles.forEach(o => {
      if (o.sprite === 'carrot_double') {
        drawCarrot(o.x, o.y, 14, o.h);
        drawCarrot(o.x + 16, o.y, 14, o.h);
      } else {
        drawCarrot(o.x, o.y, o.w, o.h);
      }
    });

    // Rabbit
    const spriteY = rabbit.y - rabbit.h;
    let sprite;
    if (state === 'dead') {
      sprite = RABBIT_SPRITES.dead;
    } else if (!rabbit.grounded) {
      sprite = RABBIT_SPRITES.jump;
    } else {
      sprite = rabbit.frame === 0 ? RABBIT_SPRITES.run1 : RABBIT_SPRITES.run2;
    }
    drawRabbitSprite(sprite, rabbit.x, spriteY, '#535353');
    drawEye(rabbit.x, spriteY, state === 'dead');

    // Score
    drawScore();

    // Game over overlay
    if (state === 'dead') {
      drawGameOver();
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  loop();
})();
</script>
</body>
</html>
