<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dot Rabbit Runner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f7f7f7;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  #gameWrapper {
    position: relative;
    width: 100%;
    max-width: 800px;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated;
    background: #f7f7f7;
  }
  #startOverlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(247,247,247,0.85);
    cursor: pointer;
    z-index: 10;
  }
  #startOverlay .title {
    font-size: 28px;
    font-weight: bold;
    color: #535353;
    margin-bottom: 8px;
    letter-spacing: 2px;
  }
  #startOverlay .sub {
    font-size: 14px;
    color: #888;
  }
  #startOverlay.hidden { display: none; }
</style>
</head>
<body>
<div id="gameWrapper">
  <canvas id="game" width="800" height="250"></canvas>
  <div id="startOverlay">
    <div class="title">DOT RABBIT RUNNER</div>
    <div class="sub">Press Space / Tap to Start</div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('startOverlay');

  // ── Constants ──
  const W = 800, H = 250;
  const GROUND_Y = 200;
  const GRAVITY = 0.6;
  const JUMP_FORCE = -11;
  const INITIAL_SPEED = 5;
  const MAX_SPEED = 13;
  const ACCEL = 0.001;
  const PIXEL = 4; // dot size for pixel art

  // ── Game State ──
  let state = 'idle'; // idle | running | dead
  let speed = INITIAL_SPEED;
  let score = 0;
  let highScore = parseInt(localStorage.getItem('rabbitHigh') || '0');
  let frameCount = 0;

  // ── Rabbit (grid-based pixel art) ──
  const P = PIXEL;
  const rabbit = {
    x: 60, y: GROUND_Y, vy: 0, w: 40, h: 48,
    grounded: true, frame: 0, frameTimer: 0
  };

  // Grid sprite: each row is a string, each char maps to a color
  // . = transparent, o = outline, b = body pink, e = ear inner,
  // w = white, p = pupil, n = nose, c = cheek, t = tail, m = mouth
  const PAL = {
    '.': null,
    'o': '#5a3e4a',  // dark outline
    'b': '#ffb6c1',  // body pink
    'B': '#ffc8d6',  // lighter pink (belly)
    'e': '#ff8fa3',  // ear inner
    'w': '#ffffff',  // white
    'p': '#2d1b33',  // pupil
    'n': '#e8a0af',  // nose (subtle pink, not red)
    'c': '#ff9eb5',  // cheek blush
    't': '#ffd1dc',  // tail
    'x': '#2d1b33',  // X eye for dead (same black as pupil)
    's': '#88ccff',  // sweat drop
  };

  // 10 wide x 12 tall grid sprites
  const SPRITES = {
    //        0123456789
    run1: [
      '..ob.ob...',  // 0  ears
      '..oe.oe...',  // 1  ear inner
      '..ob.ob...',  // 2  ear base
      '.obbbbbo..',  // 3  head top
      '.bbpbpbb..',  // 4  eyes (1px bean eyes)
      '.bcbnbcb..',  // 5  cheeks + nose
      '.obbbbbbo.',  // 6  chin
      'tobBBBBbo.',  // 7  body top + tail
      '.obBBBBbo.',  // 8  body
      '.obbbbbo..',  // 9  body bottom
      '..ob..ob..',  // 10 legs
      '..ob..ob..',  // 11 feet
    ],
    run2: [
      '..ob.ob...',
      '..oe.oe...',
      '..ob.ob...',
      '.obbbbbo..',
      '.bbpbpbb..',
      '.bcbnbcb..',
      '.obbbbbbo.',
      'tobBBBBbo.',
      '.obBBBBbo.',
      '.obbbbbo..',
      '...ob.ob..',
      '..ob......',
    ],
    jump: [
      '..ob.ob...',
      '..oe.oe...',
      '..ob.ob...',
      '.obbbbbo..',
      '.bbpbpbb..',
      '.bcbnbcb..',
      '.obbbbbbo.',
      'tobBBBBbo.',
      '.obBBBBbo.',
      '.obbbbbo..',
      '..oooooo..',
      '..........',
    ],
    dead: [
      '..ob.ob...',
      '..oe.oe...',
      '..ob.ob...',
      '.obbbbbo.s',
      '.bbpbpbbs.',
      '.bcbnbcb..',
      '.obbmbbo..',
      'tobBBBBbo.',
      '.obBBBBbo.',
      '.obbbbbo..',
      '..ob..ob..',
      '..ob..ob..',
    ],
  };

  function drawGrid(grid, x, y) {
    for (let r = 0; r < grid.length; r++) {
      const row = grid[r];
      for (let c = 0; c < row.length; c++) {
        const ch = row[c];
        if (ch === '.') continue;
        const color = PAL[ch];
        if (!color) continue;
        ctx.fillStyle = color;
        ctx.fillRect(x + c * P, y + r * P, P, P);
      }
    }
  }

  // ── Obstacles (pixel art carrots) ──
  let obstacles = [];
  const OBSTACLE_TYPES = [
    { w: 20, h: 36, sprite: 'carrot_small' },
    { w: 20, h: 48, sprite: 'carrot_tall' },
    { w: 44, h: 36, sprite: 'carrot_double' },
  ];

  // Carrot grid sprite (5 wide)
  // g = dark green, G = light green, O = dark orange, o = orange, h = highlight, T = tip
  const CARROT_PAL = {
    '.': null,
    'g': '#2d9b1b',
    'G': '#5cbf3a',
    'O': '#e07010',
    'o': '#f5871f',
    'h': '#ffbc73',
    'L': '#ff9a3c',
  };

  const CARROT_SMALL = [
    //01234
    '.gGg.',  // leaves
    'g.G.g',
    '..g..',
    '.OOO.',  // top
    '.ooo.',
    '.Lho.',
    '.ooo.',
    '.Lho.',
    '..o..',
    '..O..',  // tip
  ];

  const CARROT_TALL = [
    '.gGg.',
    'g.G.g',
    '..g..',
    '.OOO.',
    '.ooo.',
    '.Lho.',
    '.ooo.',
    '.Lho.',
    '.ooo.',
    '.oho.',
    '.ooo.',
    '..o..',
    '..o..',
    '..O..',
  ];

  function drawCarrotGrid(grid, x, y, scaleY) {
    const rowH = scaleY || P;
    for (let r = 0; r < grid.length; r++) {
      const row = grid[r];
      for (let c = 0; c < row.length; c++) {
        const ch = row[c];
        if (ch === '.') continue;
        const color = CARROT_PAL[ch];
        if (!color) continue;
        ctx.fillStyle = color;
        ctx.fillRect(x + c * P, y + r * rowH, P, rowH);
      }
    }
  }

  function drawCarrot(x, y, w, h, sprite) {
    const grid = sprite === 'carrot_tall' ? CARROT_TALL : CARROT_SMALL;
    const scaleY = h / grid.length;
    drawCarrotGrid(grid, x, y, scaleY);
  }

  function spawnObstacle() {
    const type = OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)];
    const gap = 300 + Math.random() * 200;
    const lastX = obstacles.length > 0 ? obstacles[obstacles.length - 1].x : W;
    obstacles.push({
      x: Math.max(W, lastX + gap),
      y: GROUND_Y - type.h + 4,
      w: type.w,
      h: type.h,
      sprite: type.sprite
    });
  }

  // ── Ground ──
  let groundOffset = 0;
  const groundDots = [];
  for (let i = 0; i < 50; i++) {
    groundDots.push({
      x: Math.random() * W * 2,
      y: GROUND_Y + 8 + Math.random() * 20
    });
  }

  // ── Clouds ──
  let clouds = [];
  for (let i = 0; i < 4; i++) {
    clouds.push({
      x: Math.random() * W,
      y: 30 + Math.random() * 60,
      w: 40 + Math.random() * 30,
      speed: 0.3 + Math.random() * 0.5
    });
  }

  function drawCloud(c) {
    ctx.fillStyle = '#e0e0e0';
    ctx.fillRect(c.x, c.y, c.w, PIXEL*2);
    ctx.fillRect(c.x + PIXEL*2, c.y - PIXEL, c.w - PIXEL*4, PIXEL);
    ctx.fillRect(c.x + PIXEL, c.y + PIXEL*2, c.w - PIXEL*2, PIXEL);
  }

  // ── Collision ──
  function checkCollision(r, o) {
    const pad = 6;
    return (
      r.x + pad < o.x + o.w - pad &&
      r.x + r.w - pad > o.x + pad &&
      r.y + r.h - pad < o.y + o.h &&
      r.y + r.h > o.y + pad
    );
  }

  // ── Input ──
  function jump() {
    if (state === 'idle') {
      state = 'running';
      overlay.classList.add('hidden');
    }
    if (state === 'dead') {
      resetGame();
      state = 'running';
      return;
    }
    if (rabbit.grounded && state === 'running') {
      rabbit.vy = JUMP_FORCE;
      rabbit.grounded = false;
    }
  }

  document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      jump();
    }
  });
  canvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); });
  canvas.addEventListener('mousedown', e => { jump(); });
  overlay.addEventListener('click', () => { jump(); });
  overlay.addEventListener('touchstart', e => { e.preventDefault(); jump(); });

  // ── Reset ──
  function resetGame() {
    rabbit.y = GROUND_Y;
    rabbit.vy = 0;
    rabbit.grounded = true;
    obstacles.length = 0;
    speed = INITIAL_SPEED;
    score = 0;
    frameCount = 0;
    overlay.classList.add('hidden');
  }

  // ── Score Display ──
  function drawScore() {
    ctx.fillStyle = '#535353';
    ctx.font = 'bold 16px "Courier New", monospace';
    ctx.textAlign = 'right';
    const s = String(Math.floor(score)).padStart(5, '0');
    if (highScore > 0) {
      ctx.fillStyle = '#999';
      ctx.fillText('HI ' + String(highScore).padStart(5, '0'), W - 20, 25);
      ctx.fillStyle = '#535353';
      ctx.fillText(s, W - 120, 25);
    } else {
      ctx.fillText(s, W - 20, 25);
    }
  }

  // ── Game Over ──
  function drawGameOver() {
    ctx.fillStyle = '#535353';
    ctx.font = 'bold 20px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W/2, H/2 - 20);
    ctx.font = '14px "Courier New", monospace';
    ctx.fillText('Tap / Press Space to Restart', W/2, H/2 + 10);
  }

  // ── Main Loop ──
  function update() {
    if (state !== 'running') return;

    frameCount++;
    speed = Math.min(MAX_SPEED, INITIAL_SPEED + frameCount * ACCEL);
    score += speed * 0.02;

    // Milestone sound flash
    if (Math.floor(score) % 100 === 0 && Math.floor(score) > 0) {
      // flash effect handled in draw
    }

    // Rabbit physics
    rabbit.vy += GRAVITY;
    rabbit.y += rabbit.vy;
    if (rabbit.y >= GROUND_Y) {
      rabbit.y = GROUND_Y;
      rabbit.vy = 0;
      rabbit.grounded = true;
    }

    // Animation
    rabbit.frameTimer++;
    if (rabbit.frameTimer > 6) {
      rabbit.frame = 1 - rabbit.frame;
      rabbit.frameTimer = 0;
    }

    // Ground scroll
    groundOffset = (groundOffset + speed) % W;

    // Clouds
    clouds.forEach(c => {
      c.x -= c.speed;
      if (c.x + c.w < 0) {
        c.x = W + Math.random() * 100;
        c.y = 30 + Math.random() * 60;
      }
    });

    // Obstacles
    if (obstacles.length === 0 || obstacles[obstacles.length - 1].x < W - 200) {
      if (Math.random() < 0.02 || obstacles.length === 0) {
        spawnObstacle();
      }
    }
    obstacles.forEach(o => { o.x -= speed; });
    obstacles = obstacles.filter(o => o.x + o.w > -50);

    // Collision
    const rBox = {
      x: rabbit.x, y: rabbit.y - rabbit.h,
      w: rabbit.w, h: rabbit.h
    };
    for (const o of obstacles) {
      if (checkCollision(rBox, o)) {
        state = 'dead';
        if (Math.floor(score) > highScore) {
          highScore = Math.floor(score);
          localStorage.setItem('rabbitHigh', String(highScore));
        }
        break;
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Clouds
    clouds.forEach(drawCloud);

    // Ground line
    ctx.fillStyle = '#535353';
    ctx.fillRect(0, GROUND_Y + 4, W, 1);

    // Ground dots
    groundDots.forEach(d => {
      const dx = ((d.x - groundOffset) % (W * 2) + W * 2) % (W * 2) - W * 0.5;
      if (dx > -10 && dx < W + 10) {
        ctx.fillStyle = '#ccc';
        ctx.fillRect(dx, d.y, 2, 1);
      }
    });

    // Obstacles
    obstacles.forEach(o => {
      if (o.sprite === 'carrot_double') {
        drawCarrot(o.x, o.y, 20, o.h, 'carrot_small');
        drawCarrot(o.x + 22, o.y, 20, o.h, 'carrot_small');
      } else {
        drawCarrot(o.x, o.y, o.w, o.h, o.sprite);
      }
    });

    // Rabbit
    const spriteY = rabbit.y - rabbit.h;
    let spriteKey;
    if (state === 'dead') {
      spriteKey = 'dead';
    } else if (!rabbit.grounded) {
      spriteKey = 'jump';
    } else {
      spriteKey = rabbit.frame === 0 ? 'run1' : 'run2';
    }
    drawGrid(SPRITES[spriteKey], rabbit.x, spriteY);

    // Score
    drawScore();

    // Game over overlay
    if (state === 'dead') {
      drawGameOver();
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  loop();
})();
</script>
</body>
</html>
